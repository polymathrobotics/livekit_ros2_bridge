---

name: Build Docker matrix

on:
  # Manual only on purpose. Docker image validation is useful, but we do not
  # want every in-progress branch to spend CI time building the full matrix.
  workflow_dispatch:

jobs:
  docker_matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx bake --file docker-bake.hcl --print all
      - name: Build docker matrix
        run: |
          set -euo pipefail

          # Use the OCI-published publisher images directly.
          jammy_image="docker.io/polymathrobotics/gstreamer-publisher:jammy-8825fee6f40ff51f2cf9347892f6fbc08eeb1f2e"
          noble_image="docker.io/polymathrobotics/gstreamer-publisher:noble-407891dbdca2ad3113270fbeb350ab9f47615917"
          bake_args=(
            --set "dev-humble.args.GSTREAMER_PUBLISHER_IMAGE=${jammy_image}"
            --set "runtime-humble.args.GSTREAMER_PUBLISHER_IMAGE=${jammy_image}"
          )

          for target in dev-jazzy dev-kilted dev-rolling runtime-jazzy runtime-kilted runtime-rolling; do
            bake_args+=(--set "${target}.args.GSTREAMER_PUBLISHER_IMAGE=${noble_image}")
          done

          docker buildx bake --file docker-bake.hcl --progress=plain "${bake_args[@]}" runtime-all dev-humble dev-rolling
