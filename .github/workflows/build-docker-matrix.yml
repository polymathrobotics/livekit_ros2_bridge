---

name: Build Docker matrix

on:
  # Manual only on purpose. Docker image validation is useful, but we do not
  # want every in-progress branch to spend CI time building the full matrix.
  workflow_dispatch:

jobs:
  docker_matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx bake --file docker/bake.hcl --print ci-docker
      - name: Build docker matrix
        run: docker buildx bake --file docker/bake.hcl --progress=plain ci-docker
