---

name: Publish gstreamer-publisher images

on:
  # Manual only on purpose. We only publish these pinned helper images when we
  # explicitly decide to refresh them.
  workflow_dispatch:
    inputs:
      target:
        description: Publisher target to build and push
        required: true
        default: publisher-all
        type: choice
        options:
          - publisher-all
          - publisher-jammy
          - publisher-noble

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx bake --file docker-bake.hcl --print "${{ inputs.target }}"
      - run: docker buildx bake --file docker-bake.hcl --push "${{ inputs.target }}"
