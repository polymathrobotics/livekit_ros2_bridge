---

name: Build and test Docker matrix
on:  # yamllint disable-line
  pull_request:
  push:
    branches:
      - main

jobs:
  docker_build_and_test_matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx bake --file docker/bake.hcl --print ci-test
      - name: Run docker build and test matrix
        run: docker buildx bake --file docker/bake.hcl --progress=plain ci-test
