# Example starter config for `livekit_ros2_bridge_node`.
# See `parameters.yaml` for the full parameter list and default values.
#
# Copy this file to `livekit_bridge.params.yaml` (gitignored), fill in the
# values for your environment, then run:
#   ros2 run livekit_ros2_bridge livekit_ros2_bridge_node --ros-args \
#     --params-file $(pwd)/livekit_bridge.params.yaml
#
# The runtime Docker image also expects a local params file instead of building
# one from env vars. Mount your local file to `/config/livekit_bridge.params.yaml`
# or set `LIVEKIT_BRIDGE_PARAMS_FILE` to a different in-container path.
#
# The bridge will not start until you set:
# - `livekit.url`: your LiveKit server URL
# - `livekit.room`: the room this bridge should join
# - `livekit.token`, or both `livekit.api_key` and `livekit.api_secret`
# - at least one allowed topic or service in `access.rules.*.allow`

---
livekit_ros2_bridge:
  ros__parameters:
    # Where the bridge should connect.
    livekit.url: ""  # e.g. "wss://your-livekit.example"
    livekit.room: ""  # e.g. "robot-room"

    # Recommended: set the participant name used by the bridge in LiveKit.
    livekit.identity: "" # e.g. "robot-bridge"

    # Choose one authentication method.
    # Option 1: use a token you already created.
    livekit.token: ""
    # Option 2: set both of these so the bridge can mint its own tokens.
    livekit.api_key: ""
    livekit.api_secret: ""

    # Tell the bridge what remote clients are allowed to use.
    # At least one of these allow lists must contain a real value.
    # Leave [""] as a placeholder until you are ready to choose real patterns.
    access.rules.subscribe.allow: [""]  # topics clients may subscribe to, e.g. ["/user/*"]
    access.rules.publish.allow: [""]  # topics clients may publish to, e.g. ["/user/cmd_vel"]
    access.rules.service.allow: [""]  # services clients may call, e.g. ["/example/service"]

    # Optional video sources.
    # Add entries here if you want the bridge to publish video into LiveKit.
    # `video.topic_rules.*` match one or more ROS topics by pattern.
    # `video.custom_sources.*` run in-process GStreamer source fragments that you provide.
    # Keep the IDs at the root for now because generate_parameter_library 0.6
    # in the current test matrix cannot move them cleanly under
    # `video.topic_rules.ids` / `video.custom_sources.ids` yet.
    # Topic rules use required `pattern`, optional `transform`, and optional
    # `publish.*` overrides.
    # Custom sources use required `source`, optional `transform`, and optional
    # `publish.*` overrides.
    # The bridge always appends its own queue/convert/I420/appsink tail.
    #
    # Optional default LiveKit publish policy:
    # video.publish.codec: "auto"  # or "vp8", "h264", "av1", "vp9", "h265"
    # video.publish.max_bitrate_bps: 0
    # video.publish.max_framerate: 0.0
    # video.publish.simulcast: "auto"  # or "enabled", "disabled"
    #
    # video_topic_rule_ids: ["front_camera"]
    # video_custom_source_ids: ["back_rtsp", "usb_cam"]
    #
    # video.topic_rules.front_camera.pattern: "/camera/front/*"
    # video.topic_rules.front_camera.publish.max_framerate: 15.0
    # video.topic_rules.front_camera.transform: "videoscale ! video/x-raw,width=1280,height=720"
    #
    # video.custom_sources.back_rtsp.source: "uridecodebin uri=rtsp://127.0.0.1:8554/front source::latency=0"
    # video.custom_sources.back_rtsp.publish.codec: "h264"
    # video.custom_sources.back_rtsp.transform: ""
    #
    # video.custom_sources.usb_cam.source: "v4l2src device=/dev/video0 do-timestamp=true"
    # video.custom_sources.usb_cam.transform: ""
