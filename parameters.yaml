---
livekit_ros2_bridge:
  livekit:
    url:
      type: string
      default_value: ""
      description: "LiveKit server URL."
      validation:
        not_empty<>: null
    room:
      type: string
      default_value: ""
      description: "LiveKit room name."
      validation:
        not_empty<>: null
    identity:
      type: string
      default_value: ""
      description: "Participant identity override."
    token:
      type: string
      default_value: ""
      description: "Static LiveKit token."
    api_key:
      type: string
      default_value: ""
      description: "LiveKit API key. Set together with livekit.api_secret or leave both unset."
    api_secret:
      type: string
      default_value: ""
      description: "LiveKit API secret. Set together with livekit.api_key or leave both unset."
    token_ttl_seconds:
      type: int
      default_value: 3600
      description: >-
        TTL for LiveKit tokens minted from livekit.api_key/livekit.api_secret in
        seconds. Must be greater than 0 when those credentials are used for
        bridge auth.
      validation:
        gt_eq<>: [0]
    token_refresh_margin_seconds:
      type: int
      default_value: 300
      description: "Refresh reconnect margin in seconds before token expiration."
      validation:
        gt_eq<>: [0]
  access:
    rules:
      publish:
        allow:
          type: string_array
          default_value: []
          description: "Allowlist patterns for publish targets. Empty allowlist denies all requests."
        deny:
          type: string_array
          default_value: []
          description: "Denylist patterns for publish targets."
      subscribe:
        allow:
          type: string_array
          default_value: []
          description: "Allowlist patterns for subscribe targets. Empty allowlist denies all requests."
        deny:
          type: string_array
          default_value: []
          description: "Denylist patterns for subscribe targets."
      service:
        allow:
          type: string_array
          default_value: []
          description: "Allowlist patterns for service targets. Empty allowlist denies all requests."
        deny:
          type: string_array
          default_value: []
          description: "Denylist patterns for service targets."
  subscription:
    qos_overrides:
      __map_subscription_qos_overrides_ids:
        pattern:
          type: string
          default_value: ""
          description: "ROS topic pattern to match for this subscriber QoS override."
        reliability:
          type: string
          default_value: "auto"
          description: "Subscriber reliability override: auto, reliable, or best_effort."
          validation:
            one_of<>: [["auto", "reliable", "best_effort"]]
        durability:
          type: string
          default_value: "auto"
          description: "Subscriber durability override: auto, volatile, or transient_local."
          validation:
            one_of<>: [["auto", "volatile", "transient_local"]]
  subscription_qos_overrides_ids:
    type: string_array
    default_value: []
    description: "QoS override ids defined under subscription.qos_overrides.<id>."
  publish:
    max_topics:
      type: int
      default_value: 50
      description: "Maximum active ROS publishers created by bridge ingress."
      validation:
        gt_eq<>: [0]
  # Keep video_topic_rule_ids at the root for now. generate_parameter_library 0.6.x,
  # which is still part of our supported test matrix, does not support moving this
  # cleanly to video.topic_rules.ids across all distros. Move it once GPL 0.7+ is
  # baseline everywhere in the matrix.
  video_topic_rule_ids:
    type: string_array
    default_value: []
    description: "Video topic rule ids defined under video.topic_rules.<id>."
  # Keep video_configured_source_ids at the root for now. generate_parameter_library
  # 0.6.x, which is still part of our supported test matrix, does not support
  # moving this cleanly to video.configured_sources.ids across all distros. Move it
  # once GPL 0.7+ is baseline everywhere in the matrix.
  video_configured_source_ids:
    type: string_array
    default_value: []
    description: "Video configured source ids defined under video.configured_sources.<id>."
  video:
    publish:
      codec:
        type: string
        default_value: "auto"
        description: "Global LiveKit video codec override: auto, vp8, h264, av1, vp9, or h265."
        validation:
          one_of<>: [["auto", "vp8", "h264", "av1", "vp9", "h265"]]
      max_bitrate_bps:
        type: int
        default_value: 0
        description: "Global LiveKit max video bitrate override in bps. 0 uses SDK defaults."
        validation:
          gt_eq<>: [0]
      max_framerate:
        type: double
        default_value: 0.0
        description: "Global LiveKit max video framerate override. 0 uses SDK defaults."
        validation:
          gt_eq<>: [0.0]
      simulcast:
        type: string
        default_value: "auto"
        description: "Global LiveKit simulcast override: auto, enabled, or disabled."
        validation:
          one_of<>: [["auto", "enabled", "disabled"]]
    topic_rules:
      __map_video_topic_rule_ids:
        pattern:
          type: string
          description: "Topic pattern for this video topic rule (e.g. '/camera/front/*')."
        transform:
          type: string
          default_value: ""
          description: "Optional GStreamer transform fragment inserted after bridge-managed ROS ingress."
        publish:
          codec:
            type: string
            default_value: ""
            description: "Optional LiveKit codec override for this video topic rule. Empty inherits from video.publish.codec."
            validation:
              one_of<>: [["", "auto", "vp8", "h264", "av1", "vp9", "h265"]]
          max_bitrate_bps:
            type: int
            default_value: -1
            description: "Optional LiveKit max video bitrate override for this rule in bps. -1 inherits from video.publish.max_bitrate_bps."
            validation:
              gt_eq<>: [-1]
          max_framerate:
            type: double
            default_value: -1.0
            description: "Optional LiveKit max video framerate override for this rule. -1 inherits from video.publish.max_framerate."
            validation:
              gt_eq<>: [-1.0]
          simulcast:
            type: string
            default_value: ""
            description: "Optional LiveKit simulcast override for this video topic rule. Empty inherits from video.publish.simulcast."
            validation:
              one_of<>: [["", "auto", "enabled", "disabled"]]
    configured_sources:
      __map_video_configured_source_ids:
        source:
          type: string
          description: "Ingress fragment for this configured video source (e.g. uridecodebin, v4l2src)."
        transform:
          type: string
          default_value: ""
          description: "Optional GStreamer transform fragment inserted after configured source ingress."
        publish:
          codec:
            type: string
            default_value: ""
            description: "Optional LiveKit codec override for this configured video source. Empty inherits from video.publish.codec."
            validation:
              one_of<>: [["", "auto", "vp8", "h264", "av1", "vp9", "h265"]]
          max_bitrate_bps:
            type: int
            default_value: -1
            description: >-
              Optional LiveKit max video bitrate override for this configured
              source in bps. -1 inherits from
              video.publish.max_bitrate_bps.
            validation:
              gt_eq<>: [-1]
          max_framerate:
            type: double
            default_value: -1.0
            description: "Optional LiveKit max video framerate override for this configured source. -1 inherits from video.publish.max_framerate."
            validation:
              gt_eq<>: [-1.0]
          simulcast:
            type: string
            default_value: ""
            description: "Optional LiveKit simulcast override for this configured video source. Empty inherits from video.publish.simulcast."
            validation:
              one_of<>: [["", "auto", "enabled", "disabled"]]
